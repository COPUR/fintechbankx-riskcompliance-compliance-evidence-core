# AsyncAPI contract for svc-cmp-evidence.
# Status: Proposed. This is the provider copy (source of truth); fintechbankx-governance-api-contracts-asyncapi-catalog mirrors it.
# Naming: docs/NAMING_CONVENTION_DDD_EDA_BUSINESS_CONTEXT.md
# Validate: npx -y @asyncapi/cli@2.13.0 validate api/asyncapi/svc-cmp-evidence.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-cmp-evidence
info:
  title: svc-cmp-evidence events
  version: 1.1.0
  description: |-
    Event contract for svc-cmp-evidence (repository fintechbankx-riskcompliance-compliance-evidence-core, canonical name fintechbankx-compliance-evidence-service).

    Status: Proposed. Owner: Risk and Compliance Decisioning Squad, Lending and Money Movement Tribe. Event namespace: `evt.cmp.compliance`.

    Implementation status: the service writes ComplianceScreening.Screened to its transactional outbox (sc_cmp_evidence.outbox_event) in the same transaction as the stored screening evidence, and a relay publishes it. A retried screening of the same transaction returns the stored result and publishes nothing. Delivery is at least once, in insertion order (consumers de-duplicate on eventId). Per ADR-021 decision 4 only an event whose payload cannot be sent is parked (and replayed by hand); any other failure holds back later events until it is fixed, so events can be delayed but are not skipped for broker, network or credential problems.

    Version 1.1.0: reason codes were removed from ComplianceScreenedData. They are restricted data and stay in the synchronous POST response only. No lending consumer reads them from the event, so the topic stays v1 (no v2 topic, no dual-publish); consumers already ignore unknown and absent optional data.

    Every message uses the standard envelope (common/event-envelope.yaml). Record key is the aggregateId (the screening id). Topics use cleanup.policy=delete. Adding an optional field is a minor change; any removal, rename or type change is a new major version on a new topic with dual-publish.
  tags:
  - name: compliance
  - name: evt.cmp.compliance
  x-service-id: svc-cmp-evidence
  x-event-namespace: evt.cmp.compliance
  x-owning-squad: Risk and Compliance Decisioning Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit,
      SASL_SSL with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with
      Strimzi-issued client certificates.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  screened:
    address: evt.cmp.compliance.screened.v1
    title: evt.cmp.compliance.screened.v1
    description: Compliance.ComplianceScreening.Screened.v1. A transaction was screened and its result stored as
      evidence.
    messages:
      ComplianceScreened:
        $ref: '#/components/messages/ComplianceScreened'
    bindings:
      kafka:
        topic: evt.cmp.compliance.screened.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
operations:
  publishComplianceScreened:
    action: send
    title: Publish Compliance.ComplianceScreening.Screened.v1
    summary: svc-cmp-evidence publishes Compliance.ComplianceScreening.Screened.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/screened'
    messages:
    - $ref: '#/channels/screened/messages/ComplianceScreened'
components:
  schemas:
    EventEnvelope:
      $ref: ./common/event-envelope.yaml#/EventEnvelope
    EventHeaders:
      $ref: ./common/event-envelope.yaml#/EventHeaders
    ComplianceScreenedData:
      type: object
      description: 'Payload of Compliance.ComplianceScreening.Screened.v1. Ids and the decision only; reason codes are not published (since 1.1.0).
        The inputs to screening (sanctions, PEP and KYC flags, amount) are not published; entitled readers get
        them through the compliance API.'
      properties:
        screeningId:
          type: string
          pattern: '^CMP-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          examples:
          - CMP-0b9d1c5e-3f4a-4d8e-9a71-2c6f0e5b7d10
          description: Screening id, `CMP-` followed by a UUID (same as aggregateId).
        transactionId:
          type: string
          minLength: 1
          description: Id of the screened transaction, as given by the caller.
        customerId:
          type: string
          minLength: 1
          description: Customer id (an identifier, not personal data).
        decision:
          type: string
          enum:
          - PASS
          - REVIEW
          - FAIL
          description: Screening decision of record.
        checkedAt:
          type: string
          format: date-time
          description: When the screening was made (UTC).
      required:
      - screeningId
      - transactionId
      - customerId
      - decision
      - checkedAt
  messages:
    ComplianceScreened:
      name: ComplianceScreened
      title: Compliance.ComplianceScreening.Screened.v1
      summary: A transaction was screened and its result stored as evidence.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Compliance.ComplianceScreening.Screened.v1
            producer:
              const: svc-cmp-evidence
            data:
              $ref: '#/components/schemas/ComplianceScreenedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (screeningId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.compliance.domain.ComplianceScreenedEvent
  securitySchemes:
    mskIam:
      type: userPassword
      description: SASL_SSL with SASL mechanism AWS_MSK_IAM. There is no user or password; the client signs with the
        AWS credentials of its IRSA role, and a topic-scoped IAM policy (terraform module msk-client-access) grants
        produce or consume rights. AsyncAPI has no IAM scheme type, so userPassword stands for the SASL family.
      x-sasl-mechanism: AWS_MSK_IAM
    mtls:
      type: X509
      description: Mutual TLS with Strimzi-issued client certificates (local and non-AWS clusters only).
