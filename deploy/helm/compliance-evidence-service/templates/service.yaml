apiVersion: v1
kind: Service
metadata:
  name: {{ include "compliance.name" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "compliance.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: http-management
      port: {{ .Values.service.managementPort }}
      targetPort: management
