apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "compliance.name" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  {{- $minAvailable := toString .Values.podDisruptionBudget.minAvailable }}
  {{- /* An integer or a percentage ("50%"); anything else renders as an int (0 for text). */}}
  minAvailable: {{ if regexMatch "^[0-9]{1,3}%$" $minAvailable }}{{ $minAvailable | quote }}{{ else }}{{ $minAvailable | int }}{{ end }}
  selector:
    matchLabels:
      {{- include "compliance.selectorLabels" . | nindent 6 }}
