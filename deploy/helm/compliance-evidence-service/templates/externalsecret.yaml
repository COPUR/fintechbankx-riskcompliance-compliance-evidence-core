{{- $secrets := include "compliance.externalSecretData" . | fromJson }}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "compliance.secretName" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "compliance.secretName" . }}
    creationPolicy: Owner
  {{- $_ := required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
  data:
    {{- range $secrets.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteSecretName | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
{{- include "compliance.requireMigrationSecret" . }}
---
# Schema owner credential (DB_MIGRATION_USERNAME / _PASSWORD), read only by the
# Flyway migration Job (migration-job.yaml). A hook created before the Job and
# deleted after it succeeds, so the Secret exists only while a migration runs.
# The runtime role (DB_USERNAME) gets only the grants of V7 and V12.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "compliance.migrationSecretName" . }}
  labels:
    {{- include "compliance.migrationLabels" . | nindent 4 }}
  annotations:
    {{- include "compliance.migrationPrerequisiteHook" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "compliance.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    {{- range $secrets.extraData }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteSecretName | quote }}
        property: {{ .property | quote }}
    {{- end }}
---
# This service's OIDC client credential (SVC_CLIENT_SECRET), read only by the app
# pods (deployment.yaml envFrom) for the client-credentials token the customer
# context requires (decision 0003). Property client_secret of the Secrets
# Manager entry <env>/<service account>/oidc-client (platform
# CLIENT_SECRET_DELIVERY: {client_id, client_secret, issuer_uri, token_uri});
# the migration Job never loads it. Rotation: runbook, "Rotating the client
# credential".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "compliance.oidcSecretName" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ include "compliance.oidcSecretName" . }}
    creationPolicy: Owner
  {{- $_ := include "compliance.oidcClientSecretName" . }}
  data:
    {{- range $secrets.oidcData }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteSecretName | quote }}
        property: {{ .property | quote }}
    {{- end }}
