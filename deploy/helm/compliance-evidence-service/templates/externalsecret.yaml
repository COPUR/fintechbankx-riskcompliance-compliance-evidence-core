{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "compliance.secretName" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "compliance.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
        property: password
{{- end }}
{{- if and .Values.externalSecret.enabled .Values.externalSecret.migrationSecretName }}
---
# Migration owner credential for Flyway (DB_MIGRATION_USERNAME / _PASSWORD).
# The runtime role (DB_USERNAME) gets only the grants of V7.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "compliance.migrationSecretName" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "compliance.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: DB_MIGRATION_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName }}
        property: username
    - secretKey: DB_MIGRATION_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.migrationSecretName }}
        property: password
{{- end }}
