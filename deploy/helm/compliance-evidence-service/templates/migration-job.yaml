{{- include "compliance.validateDatabaseTls" . -}}
{{- include "compliance.requireMigrationSecret" . -}}
# Flyway runs here, never in the service pods (decision 0002). Helm runs this
# Job before it creates or updates any regular resource of the release, on
# install and on upgrade; a failed Job fails the install or upgrade, so the
# Deployment is not rolled out on an unmigrated schema. The service pods hold
# only the runtime role and refuse to start while a migration is pending.
#
# Its own ServiceAccount: on a first install the release's ServiceAccount does
# not exist yet, and the Job needs neither an IAM role (Aurora takes the
# password from the db-migration secret) nor a Kubernetes API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "compliance.migrationName" . }}
  labels:
    {{- include "compliance.migrationLabels" . | nindent 4 }}
  annotations:
    {{- include "compliance.migrationPrerequisiteHook" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "compliance.migrationName" . }}
  labels:
    {{- include "compliance.migrationLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # Kept after it finishes (logs, kubectl describe) until ttlSecondsAfterFinished
    # or the next install or upgrade, which replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "compliance.migrationSelectorLabels" . | nindent 8 }}
        {{- toYaml (omit .Values.podLabels "sidecar.istio.io/inject") | nindent 8 }}
        # Written after podLabels so it overrides their value. No sidecar for the
        # Job: Aurora egress is a Kubernetes NetworkPolicy on the name label above,
        # so the Job needs no proxy, and without native sidecars an injected proxy
        # keeps the pod running after Flyway exits, so the Job never completes.
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: {{ include "compliance.migrationName" . }}
      restartPolicy: Never
      securityContext:
        {{- include "compliance.podSecurityContext" . | nindent 8 }}
      containers:
        - name: db-migration
          # The service image in migrate-only mode (DatabaseMigration): Flyway
          # migrates as the schema owner, then the process exits.
          image: {{ include "compliance.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom:
            # DB_MIGRATION_USERNAME / DB_MIGRATION_PASSWORD (schema owner).
            - secretRef:
                name: {{ include "compliance.migrationSecretName" . }}
          env:
            # The verified DB_URL of the app's ConfigMap (validateDatabaseTls), set
            # here because the ConfigMap does not exist yet on a first install.
            - name: DB_URL
              value: {{ .Values.config.DB_URL | quote }}
            # The runtime role V7 and V12 grant (Flyway placeholder runtime_role).
            - name: DB_USERNAME
              value: {{ .Values.config.DB_USERNAME | quote }}
            # Aurora CA bundle; also turns on DatabaseTlsGuard.
            - name: DB_SSL_ROOT_CERT
              value: {{ include "compliance.databaseCaFile" . | quote }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          securityContext:
            {{- include "compliance.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "compliance.databaseCaMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "compliance.databaseCaVolume" . | nindent 8 }}
