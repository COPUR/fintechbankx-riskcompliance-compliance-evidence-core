{{- include "compliance.guard" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compliance.name" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | int }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "compliance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compliance.selectorLabels" . | nindent 8 }}
        # Mesh membership labels required by the platform contract.
        app: {{ .Values.serviceAccount.name | quote }}
        version: {{ .Values.image.tag | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- if .Values.kafkaClientTls.enabled }}
        # Kafka brings its own mutual TLS; the sidecar must not wrap it (platform Kafka client guide).
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.kafkaClientTls.brokerPort | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | quote }}
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "compliance.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "compliance.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew | int }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "compliance.selectorLabels" . | nindent 14 }}
      containers:
        - name: compliance-evidence-service
          image: {{ include "compliance.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | int }}
            - name: management
              containerPort: {{ .Values.service.managementPort | int }}
          envFrom:
            - configMapRef:
                name: {{ include "compliance.name" . }}
            {{- if .Values.externalSecret.enabled }}
            # The runtime role's credential only. The schema owner's (db-migration)
            # is mounted by the migration Job alone; the service never migrates.
            - secretRef:
                name: {{ include "compliance.secretName" . }}
            {{- end }}
          env:
            # Aurora CA bundle (DB_URL sslrootcert points at the same file).
            - name: DB_SSL_ROOT_CERT
              value: {{ include "compliance.databaseCaFile" . | quote }}
            {{- if .Values.kafkaClientTls.enabled }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaClientTls.secretName | quote }}
                  key: user.crt
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaClientTls.secretName | quote }}
                  key: user.key
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaClientTls.secretName | quote }}
                  key: ca.crt
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "compliance.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "compliance.databaseCaMount" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "compliance.databaseCaVolume" . | nindent 8 }}
