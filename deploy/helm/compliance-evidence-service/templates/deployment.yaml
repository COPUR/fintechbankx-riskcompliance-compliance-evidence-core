{{- include "compliance.validateDatabaseTls" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compliance.name" . }}
  labels:
    {{- include "compliance.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "compliance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "compliance.selectorLabels" . | nindent 8 }}
        # Mesh membership labels required by the platform contract.
        app: {{ .Values.serviceAccount.name }}
        version: {{ .Values.image.tag | quote }}
        {{- toYaml .Values.podLabels | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- if .Values.kafkaClientTls.enabled }}
        # Kafka brings its own mutual TLS; the sidecar must not wrap it (platform Kafka client guide).
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.kafkaClientTls.brokerPort | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "compliance.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "compliance.selectorLabels" . | nindent 14 }}
      containers:
        - name: compliance-evidence-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "compliance.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "compliance.secretName" . }}
            {{- if .Values.externalSecret.migrationSecretName }}
            - secretRef:
                name: {{ include "compliance.migrationSecretName" . }}
            {{- end }}
            {{- end }}
          env:
            # Aurora CA bundle (DB_URL sslrootcert points at the same file).
            - name: DB_SSL_ROOT_CERT
              value: {{ include "compliance.databaseCaFile" . | quote }}
            {{- if .Values.kafkaClientTls.enabled }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaClientTls.secretName }}
                  key: user.crt
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaClientTls.secretName }}
                  key: user.key
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaClientTls.secretName }}
                  key: ca.crt
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: database-ca
              mountPath: {{ .Values.databaseCa.mountPath }}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Not optional: without the bundle the pod must not start.
        - name: database-ca
          configMap:
            name: {{ .Values.databaseCa.configMapName }}
            items:
              - key: {{ .Values.databaseCa.key }}
                path: {{ .Values.databaseCa.key }}
