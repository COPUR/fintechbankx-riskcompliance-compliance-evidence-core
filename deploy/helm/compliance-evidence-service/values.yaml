# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/compliance-evidence-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

serviceAccount:
  name: compliance-evidence-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

podLabels:
  app.kubernetes.io/part-of: fintechbankx-compliance
  fintechbankx.io/service-id: svc-cmp-evidence
  sidecar.istio.io/inject: "true"

service:
  port: 8080
  managementPort: 8081

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1Gi

# CPU only: the JVM keeps committed heap, so a memory target would pin the
# deployment at maxReplicas and block scale-down.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap.
config:
  DB_URL: ""                      # jdbc:postgresql://<aurora-writer-endpoint>:5432/db_cmp_evidence_<env>?sslmode=require
  DB_USERNAME: compliance_evidence_app
  DB_POOL_MAX: "10"
  # Amazon MSK, IAM auth through the IRSA role (deploy/terraform msk_cluster_arn).
  # The "msk" profile in application.yml sets SASL_SSL with AWS_MSK_IAM.
  KAFKA_BOOTSTRAP_SERVERS: ""     # MSK bootstrap_brokers_sasl_iam, e.g. b-1.<cluster>.kafka.<region>.amazonaws.com:9098
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  SPRING_PROFILES_ACTIVE: msk
  OIDC_ISSUER_URI: ""
  OIDC_JWK_SET_URI: ""
  OIDC_AUDIENCE: svc-cmp-evidence
  DPOP_REQUIRED: "false"           # internal callers are bound by mesh mTLS (platform contract)
  # Transactional outbox relay to evt.cmp.compliance.screened.v1. Every replica
  # runs it; a Postgres advisory lock lets one publish at a time.
  OUTBOX_RELAY_ENABLED: "true"

# Database credential, synced from AWS Secrets Manager by External Secrets Operator.
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Secrets Manager secret from deploy/terraform output app_db_secret_name.
  remoteSecretName: ""
  refreshInterval: 1h

topologySpread:
  maxSkew: 1
