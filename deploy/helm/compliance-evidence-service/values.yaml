# Defaults are production-shaped (multi-replica, spread across zones).
# Override per environment with values-<env>.yaml.

image:
  repository: ""   # e.g. <account>.dkr.ecr.<region>.amazonaws.com/fintechbankx/compliance-evidence-service
  tag: ""          # immutable tag (git SHA); never "latest"
  pullPolicy: IfNotPresent

replicaCount: 3

serviceAccount:
  name: compliance-evidence-service
  # IAM role from deploy/terraform output workload_role_arn (IRSA).
  roleArn: ""

podLabels:
  app.kubernetes.io/part-of: fintechbankx-compliance
  fintechbankx.io/service-id: svc-cmp-evidence
  # The app pods only. The migration Job (templates/migration-job.yaml) writes
  # sidecar.istio.io/inject: "false" over this label and has no switch of its
  # own: turning the sidecar on for the Job needs a hook ServiceAccount the mesh
  # authorises first (runbook, "Database migrations (Flyway Job)").
  sidecar.istio.io/inject: "true"

service:
  port: 8080
  managementPort: 8081

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 1Gi

# CPU only: the JVM keeps committed heap, so a memory target would pin the
# deployment at maxReplicas and block scale-down.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  minAvailable: 2

# Non-secret runtime settings, rendered into a ConfigMap.
config:
  # Terraform output jdbc_url, e.g. jdbc:postgresql://<aurora-writer-endpoint>:5432/db_cmp_evidence_<env>?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem
  # Every key and value here passes the platform datasource/TLS guard (fbx.guard, vendored from
  # cicd-templates 6b6c317 in templates/_fbx_helpers.tpl) and the chart's own rules (compliance.guard).
  # DB_URL: jdbc:postgresql: with sslmode=verify-full and sslrootcert=<databaseCa.mountPath>/<key> exactly
  # once (lower-case names), no sslfactory, sslfactoryarg, sslhostnameverifier, sslpasswordcallback or
  # service, no '${' or '$('. No key may name a datasource, Flyway, Liquibase, R2DBC, spring.config.*,
  # spring.profiles.* (kafka.runtime below sets the profile), SSL bundle, fintechbankx.tls.*, JVM option,
  # LOGGING_LEVEL_* or DB_SSL_ROOT_CERT setting in any spelling; keys are ConfigMap keys
  # ([-._a-zA-Z0-9]+); every value is one string without '$('. See the runbook for the full list.
  # The Flyway migration Job (schema owner) gets this URL too.
  DB_URL: ""
  # Runtime role: the service connects as it; the migration Job grants it (V7, V12).
  DB_USERNAME: compliance_evidence_app
  DB_POOL_MAX: "10"
  # Amazon MSK, IAM auth through the IRSA role (deploy/terraform msk_cluster_arn); the profile comes from
  # kafka.runtime below. The guard requires SASL_SSL with kafka.runtime msk and SSL with strimzi.
  KAFKA_BOOTSTRAP_SERVERS: ""     # MSK bootstrap_brokers_sasl_iam, e.g. b-1.<cluster>.kafka.<region>.amazonaws.com:9098
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  OIDC_ISSUER_URI: ""
  OIDC_JWK_SET_URI: ""
  OIDC_AUDIENCE: svc-cmp-evidence   # tokens must carry the service id in aud (platform contract)
  # Client ids (token azp) that may screen and read with the SERVICE role.
  SERVICE_CALLERS: svc-pay-initiation-settlement
  # Transactional outbox relay to the aggregate topic evt.cmp.compliance.v1 (ADR-019). Every replica
  # runs it; a Postgres advisory lock lets one publish at a time.
  # Off until the mesh contract lists msk for compliance-evidence-service
  # (allow-egress-msk generated for namespace compliance) and the topic exists;
  # then override with --set-string config.OUTBOX_RELAY_ENABLED=true (runbook step 5).
  # Screenings are stored and their events wait in the outbox meanwhile.
  OUTBOX_RELAY_ENABLED: "false"
  # Computed screening facts (decision 0003; runbook section 3a). Every key below is required
  # (compliance.requiredConfig in templates/_helpers.tpl): a dropped or empty key fails the render.
  # The customer context (svc-cus-profile-kyc) inside the mesh; the service reads
  # GET /api/v1/customers/{id}/screening-profile with its own client-credentials token. An absolute
  # http:// or https:// URL (in-mesh plaintext is wrapped by the sidecar's mutual TLS).
  CUSTOMER_SERVICE_URL: ""
  # The realm's token endpoint for the client-credentials grant; https only, the credential travels in
  # the request body. Example: https://<idp>/realms/fintechbankx/protocol/openid-connect/token
  OIDC_TOKEN_URI: ""
  # This service's client id (token azp). Its credential (SVC_CLIENT_SECRET) is never a config key: the
  # app pods read it from the oidc-client ExternalSecret (externalSecret.oidcClientSecretName below).
  SVC_CLIENT_ID: svc-cmp-evidence
  # Deprecated POST /api/v1/compliance/screen (caller-attested facts): "true" (the default) keeps serving
  # it while payments still calls v1; "false" answers 410 and names /api/v2/compliance/screen. Set it to
  # "false" only after payments has moved to v2 (runbook, cut-over step). Exactly "true" or "false".
  COMPLIANCE_V1_CALLER_FACTS_ENABLED: "true"
  # A screening is refused (503 SCREENING_SOURCE_UNAVAILABLE) while a list is empty or a source was loaded
  # longer ago than this. ISO-8601 durations (P1D, PT12H, P35D).
  COMPLIANCE_LIST_MAX_AGE_SANCTIONS: P1D
  COMPLIANCE_LIST_MAX_AGE_PEP: P35D
  # The list sources (loader argument list-source) every screening must find loaded and fresh; a missing
  # or stale required source is a 503, hit or no hit. Comma-separated names of letters, digits, . _ -
  # with no spaces. Group Compliance confirms the set before cut-over (runbook section 3a).
  COMPLIANCE_SANCTIONS_REQUIRED_SOURCES: UN,OFAC-SDN,UAE-LOCAL
  COMPLIANCE_PEP_REQUIRED_SOURCES: UAE-PEP

# The only Spring profile the chart renders (SPRING_PROFILES_ACTIVE in the ConfigMap):
#   msk     -> kafka-msk: Amazon MSK IAM over SASL_SSL (application.yml), the default;
#   strimzi -> kafka-strimzi: in-cluster Strimzi mutual TLS over SSL; needs kafkaClientTls.enabled and
#              config.KAFKA_SECURITY_PROTOCOL=SSL.
# No config key may set a profile.
kafka:
  runtime: msk

# Amazon RDS CA bundle for Aurora TLS with certificate and host-name verification
# (cicd-templates 4f0f266). ConfigMap rds-ca-bundle (key global-bundle.pem) is
# published in each service namespace by the mesh platform repo's trust-manager
# Bundle. Mounted read-only at mountPath and exported as DB_SSL_ROOT_CERT, which
# the service's TLS startup assertions (on by default) require; the volume is not
# optional, so a missing bundle keeps the pod from starting instead of connecting
# unverified. There is no switch to turn it off: this service always has a
# PostgreSQL database, and the assertions' only switches (the local profile, the
# test property fintechbankx.tls.enforce) are refused as config keys.
# The platform guard (fbx.guard, cicd-templates 6b6c317) pins all three values
# below while the bundle is mounted: any other value, or null, fails the render.
databaseCa:
  configMapName: rds-ca-bundle
  key: global-bundle.pem
  mountPath: /etc/fintechbankx/rds-ca

# Credentials synced from AWS Secrets Manager by External Secrets Operator: the runtime database
# role, the schema owner (migration Job only) and this service's OIDC client (app pods only).
externalSecret:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  # Secrets Manager secret from deploy/terraform output app_db_secret_name.
  remoteSecretName: ""
  # Required. Secrets Manager secret <env>/compliance-evidence-service/db-migration
  # (Terraform output migration_db_secret_name): the schema owner's
  # {"username","password"}, read only by the migration Job below. The service
  # pods never mount it.
  migrationSecretName: ""
  # Required. Secrets Manager secret <env>/compliance-evidence-service/oidc-client, published by the
  # platform identity repo (publish-oidc-client-secrets.sh) as a JSON object with client_id,
  # client_secret, issuer_uri and token_uri. The chart's third ExternalSecret reads the property
  # client_secret into the Kubernetes Secret <serviceAccount.name>-oidc-client, key SVC_CLIENT_SECRET,
  # which only the app pods load (envFrom); the migration Job never does. The reference is not
  # optional, so a pod without the credential does not start instead of refusing every v2 screening.
  # Rotation: runbook, "Rotating the client credential".
  oidcClientSecretName: ""
  refreshInterval: 1h

topologySpread:
  maxSkew: 1

# Flyway migration Job (templates/migration-job.yaml): Helm pre-install and
# pre-upgrade hook running this image with the argument "migrate" as the schema
# owner, before any pod of the release starts or is replaced. A failed Job fails
# the install or upgrade; give helm --timeout more than activeDeadlineSeconds
# (runbook, "Database migrations"). The pods label themselves
# app.kubernetes.io/name=<serviceAccount.name>, app.kubernetes.io/component=db-migration.
migrationJob:
  # One retry: each migration is transactional in PostgreSQL, so a retry after a
  # dropped connection starts from the last applied version.
  backoffLimit: 1
  activeDeadlineSeconds: 600
  # Finished Jobs (and their logs) are removed after a day, or replaced by the
  # next install or upgrade.
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 768Mi

# No NetworkPolicy in this chart: ingress (payments, istio-ingress, observability)
# is owned by the service-mesh repository (mesh #11, 128e19d).

# Strimzi only (kafka.runtime strimzi, which requires it): maps the client
# certificate, key and cluster CA from this Secret (keys user.crt, user.key,
# ca.crt) to KAFKA_TLS_CERT/KEY/CA, and keeps the sidecar off Kafka's own mTLS.
kafkaClientTls:
  enabled: false
  secretName: kafka-client-tls
  brokerPort: 9093

# Common metric tags. app is the serviceAccount name above; squad owns the alerts.
metrics:
  squad: compliance
