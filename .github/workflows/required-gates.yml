name: Required Gates

on:
  pull_request:
    branches: [main, dev, staging]
    # labeled/unlabeled re-run the test-first guard when no-behaviour-change is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            GRADLE=gradle
            if [ -x ./gradlew ]; then GRADLE=./gradlew; fi
            if ! $GRADLE --no-daemon clean assemble -x test; then
              if [ -f .ci/allow-gradle-fail ]; then
                echo "Gradle build failed but .ci/allow-gradle-fail is present; continuing."
              else
                exit 1
              fi
            fi
          else
            echo "No Gradle root build in this repository; skipping Gradle build."
          fi
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json build in this repository; skipping Node build."
          fi

  test:
    name: ci/test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db_cmp_evidence_test
          POSTGRES_USER: compliance_test
          POSTGRES_PASSWORD: compliance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance_test -d db_cmp_evidence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests in compliance-bootstrap run Flyway and the full service against this database.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/db_cmp_evidence_test
      TEST_DB_USERNAME: compliance_test
      TEST_DB_PASSWORD: compliance_test
      # Fail, rather than skip, the integration tests if the database is missing.
      REQUIRE_TEST_DB: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test-first guard (ADR-029)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          NO_BEHAVIOUR_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-behaviour-change') }}
        shell: bash
        run: |
          # A PR that changes production code must change a test too, unless it is
          # labelled no-behaviour-change.
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          main_changed="$(printf '%s\n' "$changed" | grep -E '(^|/)src/main/' || true)"
          test_changed="$(printf '%s\n' "$changed" | grep -E '(^|/)src/test/' || true)"
          if [ -n "$main_changed" ] && [ -z "$test_changed" ]; then
            if [ "$NO_BEHAVIOUR_CHANGE" = "true" ]; then
              echo "src/main changed without src/test, allowed by label no-behaviour-change."
            else
              echo "This PR changes production code but no test (ADR-029, test first):"
              printf '%s\n' "$main_changed"
              echo "Add or change a test under src/test/, or label the PR no-behaviour-change."
              exit 1
            fi
          else
            echo "Test-first guard passed."
          fi

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests and coverage gates
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ] || [ -f gradlew ]; then
            GRADLE=gradle
            if [ -x ./gradlew ]; then GRADLE=./gradlew; fi
            # check = tests + jacoco coverage verification (platform CI default).
            if ! $GRADLE --no-daemon check; then
              if [ -f .ci/allow-gradle-fail ]; then
                echo "Gradle test failed but .ci/allow-gradle-fail is present; continuing."
              else
                exit 1
              fi
            fi
          else
            echo "No Gradle root test task in this repository; skipping Gradle test."
          fi
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No package.json test in this repository; skipping Node test."
          fi

      - name: OpenAPI contract lint
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          if ls openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint openapi/*.yaml
          elif ls api/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint api/openapi/*.yaml
          elif ls src/main/resources/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint src/main/resources/openapi/*.yaml
          fi

      - name: Install oasdiff
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSfL https://github.com/oasdiff/oasdiff/releases/download/v1.12.1/oasdiff_1.12.1_linux_amd64.tar.gz \
            | tar -xz -C "$tmpdir"
          sudo install "$tmpdir/oasdiff" /usr/local/bin/oasdiff
          rm -rf "$tmpdir"

      - name: OpenAPI breaking-change guard
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        run: ./scripts/ci/oasdiff-breaking.sh

      - name: OpenAPI waiver lifecycle (pull request and post-merge push)
        if: ${{ github.event_name == 'pull_request' && hashFiles('api/openapi/*.accepted-breaking.txt') != '' }}
        run: ./scripts/ci/test-oasdiff-waiver.sh

      - name: FAPI/DPoP contract guard
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' || hashFiles('src/main/resources/openapi/*.yaml') != '' }}
        run: ./scripts/ci/fapi-dpop-guard.sh

      - name: AsyncAPI contract lint
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          # api/asyncapi/common holds shared schemas resolved through $ref, not standalone documents.
          for spec in api/asyncapi/*.yaml; do
            npx -y @asyncapi/cli@2.13.0 validate "$spec"
          done

      - name: AsyncAPI breaking-change gate (ADR-019 section 5)
        if: ${{ hashFiles('api/asyncapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
          BASE_REF: origin/main
        shell: bash
        run: |
          # Catalog script copied unchanged (asyncapi-catalog a7b9b9d); a spec not yet on main is "new file, skipped".
          npm ci --prefix scripts/ci/asyncapi --ignore-scripts
          ./scripts/ci/asyncapi/run-breaking.sh

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          ./scripts/ci/check-generic-maps.sh .
          # The gate itself must reject a Map<String,Object> planted in a module controller or DTO.
          ./scripts/ci/test-generic-maps-gate.sh

  security:
    name: ci/security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C "$tmpdir"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }
