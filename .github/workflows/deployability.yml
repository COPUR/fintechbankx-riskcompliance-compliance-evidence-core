name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag compliance-evidence-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' compliance-evidence-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kubeconform
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Asset per runner architecture (hosted amd64, fbx-ci arm64), each checked against the release's sha256
          # (governance ci-runner/tool-downloads-by-arch.snippet.sh).
          case "$(uname -m)" in
            x86_64) kubeconform_arch=amd64; kubeconform_sha=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73 ;;
            aarch64|arm64) kubeconform_arch=arm64; kubeconform_sha=dc82f79bb03c5479b1ae5fd4af221e4b5a3111f62bf01a2795d9c5c20fa96644 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-${kubeconform_arch}.tar.gz"
          echo "${kubeconform_sha}  $tmpdir/kubeconform.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/kubeconform.tar.gz"
          sudo install "$tmpdir/kubeconform" /usr/local/bin/kubeconform
          rm -rf "$tmpdir"
      # verify-vendored-guard.sh needs node 18 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendored platform guard (cicd-templates 73e1881)
        shell: bash
        run: |
          # Source: COPUR/fintechbankx-platform-delivery-iac-cicd-templates
          #   charts/fintechbankx-service/templates/_helpers.tpl at commit 73e1881, copied whole and unchanged,
          #   without a header, to templates/_fbx_helpers.tpl; scripts/ci/verify-vendored-guard.sh from the same commit.
          # Checks (a) the one file defining fbx.guard has this sha256, (b) no other fbx.* define or block anywhere in
          # the chart, (c) every workload template (Deployment, migration Job) runs fbx.guard, here through the
          # compliance.guard adapter, before any output. Re-copy both files and re-pin digest and commit together.
          bash scripts/ci/verify-vendored-guard.sh deploy/helm/compliance-evidence-service 4f2cdfe056f5afce0297f699c8b66cb80dc42e8e311759bf4a973f8a15b28b2d
      - name: Lint and render chart
        run: bash scripts/ci/chart-render-probes.sh
      - name: Strict schema validation of the rendered chart
        shell: bash
        run: |
          set -euo pipefail
          chart=deploy/helm/compliance-evidence-service
          args="--set image.repository=ci/compliance-evidence-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=ci/compliance-evidence-service/db-app"
          args="$args --set externalSecret.migrationSecretName=ci/compliance-evidence-service/db-migration"
          # Aurora TLS (cicd-templates 4f0f266): the Terraform jdbc_url shape, verify-full against the mounted RDS CA bundle.
          args="$args --set config.DB_URL=jdbc:postgresql://ci:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci/realms/fintechbankx --set config.OIDC_JWK_SET_URI=https://ci/certs"
          # Schemas pinned to commits: Kubernetes 1.30 (strict) and the ExternalSecret CRD.
          k8s='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/39a87cd29966bc0b3434e8cfbc2061782c8cb69a/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json'
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "-f $chart/values-dev.yaml"; do
            helm template ci "$chart" $values $args \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location "$k8s" -schema-location "$crds"
          done

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Offline runs with a mocked AWS provider (tests/*.tftest.hcl): only the secrets KMS key
      # carries fintechbankx.io/secrets and var.tags cannot add it.
      - run: terraform test

  data-split:
    name: deploy/data-split-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backfill
          POSTGRES_PASSWORD: backfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backfill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: backfill
      PGPASSWORD: backfill
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse monolith-to-service compliance report backfill and reconciliation
        run: scripts/migration/verify-backfill.sh
      # Sanctions and PEP list loads (scripts/ops/load-screening-list.sh): transactional replace per source,
      # loader-side normalisation (python3 on ubuntu-latest) checked against the Java domain's fixtures, every refusal probed.
      - name: Rehearse the screening list load (sanctions, PEP)
        run: scripts/ops/test/rehearse-screening-list-load.sh
