name: Deployability

# Proves every change still produces a runnable image and valid deployment
# manifests. Nothing is pushed or applied from here.

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  container:
    name: deploy/container-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag compliance-evidence-service:${{ github.sha }} .
      - name: Image runs as non-root
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' compliance-evidence-service:${{ github.sha }})"
          echo "image user: $user"
          test "$user" = "10001:10001"

  helm:
    name: deploy/helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kubeconform
        shell: bash
        env:
          KUBECONFORM_VERSION: v0.6.7
          # sha256 of kubeconform-linux-amd64.tar.gz, from the release's CHECKSUMS file.
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          tmpdir="$(mktemp -d)"
          curl -sSfL -o "$tmpdir/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $tmpdir/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/kubeconform.tar.gz" -C "$tmpdir" kubeconform
          sudo install "$tmpdir/kubeconform" /usr/local/bin/kubeconform
          rm -rf "$tmpdir"
      - name: Lint and render chart
        run: |
          chart=deploy/helm/compliance-evidence-service
          args="--set image.repository=ci/compliance-evidence-service --set image.tag=${{ github.sha }} --set externalSecret.remoteSecretName=ci/compliance-evidence-service/db-app"
          args="$args --set config.DB_URL=jdbc:postgresql://ci:5432/db --set config.KAFKA_BOOTSTRAP_SERVERS=ci:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci/realms/fintechbankx --set config.OIDC_JWK_SET_URI=https://ci/certs"
          # Empty required settings must fail the render, not produce pods that cannot start.
          if helm template ci "$chart" --set image.repository=ci/x --set image.tag=x --set externalSecret.remoteSecretName=ci/db-app > /dev/null 2>&1; then
            echo "chart rendered without required runtime config"; exit 1
          fi
          helm lint "$chart" $args
          helm template ci "$chart" $args > /dev/null
          helm template ci "$chart" -f "$chart/values-dev.yaml" $args > /dev/null
          rendered="$(helm template ci "$chart" $args)"
          # Platform contract: mesh and network policy belong to the service-mesh repo (ingress from payments:
          # mesh #11, 128e19d), secrets to the one ClusterSecretStore.
          if grep -qE "kind: (NetworkPolicy|PeerAuthentication|AuthorizationPolicy|SecretStore)$" <<<"$rendered"; then
            echo "chart must not ship a NetworkPolicy, mesh policies or its own SecretStore" >&2
            exit 1
          fi
          grep -q "name: aws-secrets-manager" <<<"$rendered"
          grep -q "app: compliance-evidence-service" <<<"$rendered"
          # Platform outbox alerts key on service_id, scraped from the pod label; a wrong render must fail.
          python3 scripts/ci/check-service-id-label.py svc-cmp-evidence <<<"$rendered"
          # Platform scrapes the management port through these pod annotations; the outbox alerts depend on them.
          python3 scripts/ci/check-scrape-annotations.py <<<"$rendered"
          if helm template ci "$chart" $args | sed '/prometheus.io\/path:/d' \
              | python3 scripts/ci/check-scrape-annotations.py 2>/dev/null; then
            echo "scrape annotation check accepted a render without prometheus.io/path" >&2; exit 1
          fi
          if helm template ci "$chart" $args --set 'podLabels.fintechbankx\.io/service-id=svc-other' \
              | python3 scripts/ci/check-service-id-label.py svc-cmp-evidence 2>/dev/null; then
            echo "service-id label check accepted a wrong label" >&2; exit 1
          fi
          # The relay stays off until the mesh contract gives this namespace MSK egress (runbook step 1).
          grep -q 'OUTBOX_RELAY_ENABLED: "false"' <<<"$rendered"
          helm template ci "$chart" $args --set-string config.OUTBOX_RELAY_ENABLED=true | grep -q 'OUTBOX_RELAY_ENABLED: "true"'
          # Migration owner credential: its own ExternalSecret and env vars when configured.
          migration="$(helm template ci "$chart" $args --set externalSecret.migrationSecretName=ci/compliance-evidence-service/db-migration)"
          grep -q "secretKey: DB_MIGRATION_USERNAME" <<<"$migration"
          grep -q "name: compliance-evidence-service-db-migration" <<<"$migration"
          if grep -q "DB_MIGRATION_USERNAME" <<<"$rendered"; then echo "migration secret rendered without migrationSecretName" >&2; exit 1; fi
          # Secrets contract: each ExternalSecret is labelled with the service account and reads only <env>/<sa>/... keys.
          sa="$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["serviceAccount"]["name"])' "$chart/values.yaml")"
          python3 scripts/ci/check-externalsecrets.py "$sa" <<<"$migration"
          # ...and the check catches a wrong render.
          if helm template ci "$chart" $args --set externalSecret.remoteSecretName=ci/other-service/db-app \
              | python3 scripts/ci/check-externalsecrets.py "$sa" 2>/dev/null; then
            echo "ExternalSecret check accepted a key outside <env>/$sa/" >&2; exit 1
          fi
          # Platform metric tags: app = the service account, squad = compliance (application.yml reads both).
          grep -qx "  METRICS_APP: \"$sa\"" <<<"$rendered"
          grep -qx '  METRICS_SQUAD: "compliance"' <<<"$rendered"
          helm template ci "$chart" $args --set kafkaClientTls.enabled=true --set config.SPRING_PROFILES_ACTIVE=kafka-strimzi > /dev/null
      - name: Strict schema validation of the rendered chart
        shell: bash
        run: |
          set -euo pipefail
          chart=deploy/helm/compliance-evidence-service
          args="--set image.repository=ci/compliance-evidence-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=ci/compliance-evidence-service/db-app"
          args="$args --set externalSecret.migrationSecretName=ci/compliance-evidence-service/db-migration"
          args="$args --set config.DB_URL=jdbc:postgresql://ci:5432/db --set config.KAFKA_BOOTSTRAP_SERVERS=ci:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci/realms/fintechbankx --set config.OIDC_JWK_SET_URI=https://ci/certs"
          # Schemas pinned to commits: Kubernetes 1.30 (strict) and the ExternalSecret CRD.
          k8s='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/39a87cd29966bc0b3434e8cfbc2061782c8cb69a/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json'
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "-f $chart/values-dev.yaml"; do
            helm template ci "$chart" $values $args \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location "$k8s" -schema-location "$crds"
          done

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  data-split:
    name: deploy/data-split-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backfill
          POSTGRES_PASSWORD: backfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backfill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: backfill
      PGPASSWORD: backfill
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse monolith-to-service compliance report backfill and reconciliation
        run: scripts/migration/verify-backfill.sh
