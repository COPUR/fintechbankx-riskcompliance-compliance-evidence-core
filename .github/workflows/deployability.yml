          reject_mutation "a Job with a writable root filesystem" \
            'job["spec"]["template"]["spec"]["containers"][0]["securityContext"]["readOnlyRootFilesystem"] = False'
          reject_mutation "a Job that does not run the migrate mode" \
            'job["spec"]["template"]["spec"]["containers"][0]["args"] = []'
          reject_mutation "a Service selecting by name only" \
            'del one("Service")["spec"]["selector"]["app.kubernetes.io/component"]'
          reject_mutation "a NetworkPolicy selecting the Job pods" \
            'docs.append({"kind": "NetworkPolicy", "metadata": {"name": "np"}, "spec": {"podSelector": {"matchExpressions": [{"key": "app.kubernetes.io/component", "operator": "In", "values": ["db-migration"]}]}}})'
          reject_mutation "a PDB selecting by name only" \
            'del one("PodDisruptionBudget")["spec"]["selector"]["matchLabels"]["app.kubernetes.io/component"]'
          # Platform metric tags: app = the service account, squad = compliance (application.yml reads both).
          grep -qx "  METRICS_APP: \"$sa\"" <<<"$rendered"
          grep -qx '  METRICS_SQUAD: "compliance"' <<<"$rendered"
      - name: Strict schema validation of the rendered chart
        shell: bash
        run: |
          set -euo pipefail
          chart=deploy/helm/compliance-evidence-service
          args="--set image.repository=ci/compliance-evidence-service --set image.tag=${{ github.sha }}"
          args="$args --set externalSecret.remoteSecretName=ci/compliance-evidence-service/db-app"
          args="$args --set externalSecret.migrationSecretName=ci/compliance-evidence-service/db-migration"
          # Aurora TLS (cicd-templates 4f0f266): the Terraform jdbc_url shape, verify-full against the mounted RDS CA bundle.
          args="$args --set config.DB_URL=jdbc:postgresql://ci:5432/db?sslmode=verify-full&sslrootcert=/etc/fintechbankx/rds-ca/global-bundle.pem"
          args="$args --set config.KAFKA_BOOTSTRAP_SERVERS=ci:9098"
          args="$args --set config.OIDC_ISSUER_URI=https://ci/realms/fintechbankx --set config.OIDC_JWK_SET_URI=https://ci/certs"
          # Schemas pinned to commits: Kubernetes 1.30 (strict) and the ExternalSecret CRD.
          k8s='https://raw.githubusercontent.com/yannh/kubernetes-json-schema/39a87cd29966bc0b3434e8cfbc2061782c8cb69a/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json'
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for values in "" "-f $chart/values-dev.yaml"; do
            helm template ci "$chart" $values $args \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location "$k8s" -schema-location "$crds"
          done

  terraform:
    name: deploy/terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Offline runs with a mocked AWS provider (tests/*.tftest.hcl): only the secrets KMS key
      # carries fintechbankx.io/secrets and var.tags cannot add it.
      - run: terraform test

  data-split:
    name: deploy/data-split-rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backfill
          POSTGRES_PASSWORD: backfill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backfill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: backfill
      PGPASSWORD: backfill
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse monolith-to-service compliance report backfill and reconciliation
        run: scripts/migration/verify-backfill.sh
