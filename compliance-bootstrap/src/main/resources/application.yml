# svc-cmp-evidence runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: compliance-evidence-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_cmp_evidence_local}
    username: ${DB_USERNAME:compliance_evidence_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_cmp_evidence
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_cmp_evidence
        jdbc:
          time_zone: UTC
          batch_size: 50
  flyway:
    schemas: sc_cmp_evidence
    default-schema: sc_cmp_evidence
    create-schemas: true
    locations: classpath:db/migration
  # Outbox relay producer. Locally PLAINTEXT; on AWS the "msk" profile below
  # switches to SASL_SSL with IAM auth through the pod's IRSA role.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fintechbankx}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fintechbankx/protocol/openid-connect/certs}
          # Tokens must be issued for this service (Keycloak audience mapper on the caller's client).
          audiences: ${OIDC_AUDIENCE:svc-cmp-evidence}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-cmp-evidence
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-cmp-evidence

security:
  dpop:
    # true once every caller sends DPoP-bound tokens; bound tokens are always checked.
    required: ${DPOP_REQUIRED:false}
    proof-window: PT60S

compliance:
  outbox:
    retention: P7D
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: PT1S
      batch-size: 100
      send-timeout: PT10S

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

---
# Amazon MSK with IAM authentication (SPRING_PROFILES_ACTIVE=msk, set by the
# Helm chart). Credentials come from the pod's IRSA role; nothing secret here.
spring:
  config:
    activate:
      on-profile: msk
  kafka:
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: "software.amazon.msk.auth.iam.IAMLoginModule required;"
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler
