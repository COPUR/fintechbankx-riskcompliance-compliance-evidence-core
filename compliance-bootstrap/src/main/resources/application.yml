# svc-cmp-evidence runtime configuration.
# Every environment-specific value comes from the environment (Helm values,
# Kubernetes Secret synced from AWS Secrets Manager); nothing secret is here.
spring:
  application:
    name: compliance-evidence-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_cmp_evidence_local}
    username: ${DB_USERNAME:compliance_evidence_app}
    # The credential is bound from SPRING_DATASOURCE_PASSWORD (Kubernetes Secret
    # synced from AWS Secrets Manager); it is never written in this file.
    hikari:
      schema: sc_cmp_evidence
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sc_cmp_evidence
        jdbc:
          time_zone: UTC
          batch_size: 50
  flyway:
    schemas: sc_cmp_evidence
    default-schema: sc_cmp_evidence
    create-schemas: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fintechbankx}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fintechbankx/protocol/openid-connect/certs}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      service: svc-cmp-evidence
    distribution:
      percentiles-histogram:
        http.server.requests: true
  observations:
    key-values:
      service: svc-cmp-evidence

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
