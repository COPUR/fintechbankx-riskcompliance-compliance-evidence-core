apply plugin: 'jacoco'

description = 'Compliance Infrastructure - Web, persistence and outbox adapters for compliance context'

dependencies {
    implementation project(':compliance-domain')
    implementation project(':compliance-application')

    // Persistence: own schema sc_cmp_evidence, Flyway migrations in src/main/resources/db/migration
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Inbound HTTP and security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Messaging (transactional outbox relay to Kafka) and metrics
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

jacoco {
    toolVersion = '0.8.14'
}

// The gate covers every adapter. JPA adapters and Spring wiring are exercised
// by compliance-bootstrap's PostgreSQL integration tests, so their execution
// data counts here too: ./gradlew check needs TEST_DB_URL (CI) or Docker.
def complianceInfrastructureCoverageIncludes = [
    'com/bank/compliance/infrastructure/config/**',
    'com/bank/compliance/infrastructure/outbox/**',
    'com/bank/compliance/infrastructure/persistence/**',
    'com/bank/compliance/infrastructure/security/**',
    'com/bank/compliance/infrastructure/web/**'
]
def bootstrapTestExecution = project(':compliance-bootstrap').layout.buildDirectory.file('jacoco/test.exec')

jacocoTestReport {
    dependsOn test, ':compliance-bootstrap:test'
    executionData.from(bootstrapTestExecution)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, include: complianceInfrastructureCoverageIncludes)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    executionData.from(bootstrapTestExecution)
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect { dir ->
            fileTree(dir: dir, include: complianceInfrastructureCoverageIncludes)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
